<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Control - Silla Inteligente</title>

  <!-- Estilos generales -->
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0a0a0a, #1c1c1c);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      text-align: center;
      color: #00d4ff;
      text-shadow: 0 0 8px #00d4ff;
    }

    /* Contenedor principal */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      width: 90%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.3);
    }

    /* Joystick */
    .joystick {
      position: relative;
      width: 180px;
      height: 180px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
    }

    .stick {
      position: absolute;
      width: 60px;
      height: 60px;
      background: #00d4ff;
      border-radius: 50%;
      transition: 0.15s;
    }

    /* Controles de elevación */
    .lift-controls {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      background: #00d4ff;
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
    }

    button:hover {
      background: #00aaff;
      transform: scale(1.05);
    }

    /* LCD */
    .lcd {
      width: 90%;
      background: #021012;
      border: 3px solid #00d4ff;
      border-radius: 10px;
      color: #00ff88;
      padding: 10px;
      font-family: "Courier New", monospace;
      min-height: 80px;
      box-shadow: inset 0 0 10px #00d4ff;
      overflow-y: auto;
    }

    .lcd p {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.4;
    }

  </style>
</head>

<body>
  <h1>Panel de Control - Silla Inteligente</h1>
  <div class="container">
    <!-- 🕹️ Joystick -->
    <div class="joystick" id="joystick">
      <div class="stick" id="stick"></div>
    </div>

    <!-- 🪜 Controles de elevación -->
    <div class="lift-controls">
      <button id="btnSubir">Subir</button>
      <button id="btnBajar">Bajar</button>
      <button id="btnAuto">Auto</button>
    </div>

    <!-- 🖥️ LCD -->
    <div class="lcd" id="lcd">
      <p>Esperando conexión...</p>
    </div>
  </div>

  <!-- 🔥 Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

    // 🚀 Configura tus datos de Firebase
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com/",
      projectId: "TU_PROYECTO",
      storageBucket: "TU_PROYECTO.appspot.com",
      messagingSenderId: "XXXXXXXX",
      appId: "XXXXXXXX"
    };

    // Inicialización Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 🔘 Joystick
    const joystick = document.getElementById("joystick");
    const stick = document.getElementById("stick");
    let centerX, centerY;

    joystick.addEventListener("mousedown", startMove);
    joystick.addEventListener("touchstart", startMove);

    function startMove(e) {
      e.preventDefault();
      const rect = joystick.getBoundingClientRect();
      centerX = rect.left + rect.width / 2;
      centerY = rect.top + rect.height / 2;
      document.addEventListener("mousemove", moveStick);
      document.addEventListener("mouseup", stopMove);
      document.addEventListener("touchmove", moveStick);
      document.addEventListener("touchend", stopMove);
    }

    function moveStick(e) {
      let clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const dx = clientX - centerX;
      const dy = clientY - centerY;
      const distance = Math.min(60, Math.sqrt(dx * dx + dy * dy));
      const angle = Math.atan2(dy, dx);

      const stickX = distance * Math.cos(angle);
      const stickY = distance * Math.sin(angle);

      stick.style.transform = `translate(${stickX}px, ${stickY}px)`;

      let command = "STOP";
      if (distance > 20) {
        if (Math.abs(dx) > Math.abs(dy)) {
          command = dx > 0 ? "DERECHA" : "IZQUIERDA";
        } else {
          command = dy > 0 ? "ATRAS" : "ADELANTE";
        }
      }
      enviarComando("movimiento", command);
    }

    function stopMove() {
      stick.style.transform = "translate(0, 0)";
      enviarComando("movimiento", "STOP");
      document.removeEventListener("mousemove", moveStick);
      document.removeEventListener("mouseup", stopMove);
      document.removeEventListener("touchmove", moveStick);
      document.removeEventListener("touchend", stopMove);
    }

    // 🪜 Botones de elevación
    document.getElementById("btnSubir").addEventListener("click", () => enviarComando("elevacion", "SUBIR"));
    document.getElementById("btnBajar").addEventListener("click", () => enviarComando("elevacion", "BAJAR"));
    document.getElementById("btnAuto").addEventListener("click", () => enviarComando("elevacion", "AUTO"));

    // 📤 Envío de comandos
    function enviarComando(ruta, valor) {
      set(ref(db, "silla/" + ruta), valor);
    }

    // 📥 Lectura de mensajes (LCD)
    const lcd = document.getElementById("lcd");
    const lcdRef = ref(db, "silla/lcd");

    onValue(lcdRef, (snapshot) => {
      const texto = snapshot.val() || "Sin datos";
      lcd.innerHTML = `<p>${texto}</p>`;
    });
  </script>
</body>
</html>
